<!DOCTYPE html>
<html>
<head>
    <title>My To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>My Tasks</h1>
        <p>Organize your day.</p>

        <form id="taskForm">
            <input type="text" id="taskInput" placeholder="Enter a task">
            <button type="submit">Add</button>
        </form>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
